name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr:
    name: Validate PR Title & Description
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows convention
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            // An optional (scope) is part of Conventional Commits, and it is
            // what this repo actually writes: 18 of the 25 commits on main
            // before this change used one. Matching bare prefixes only meant
            // the check rejected the project's own dominant convention —
            // "docs(version):" and "fix(ops):" were both failed by it, and
            // the fix each time was to reword a perfectly good title.
            const types = ['feat', 'fix', 'docs', 'refactor', 'test', 'chore', 'ci'];
            const pattern = new RegExp(`^(${types.join('|')})(\\([a-z0-9._-]+\\))?!?: .+`, 'i');
            if (!pattern.test(title)) {
              core.setFailed(
                `PR title "${title}" must be "<type>: <description>" or ` +
                `"<type>(<scope>): <description>", where <type> is one of: ` +
                `${types.join(', ')}\n` +
                'Examples:\n' +
                '  fix: resolve duplicate message in /set_rollcall_time\n' +
                '  fix(ops): pin the rclone image instead of tracking :latest'
              );
            }

  auto-label:
    name: Auto-label PR by branch name
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label by branch prefix
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const labelMap = {
              'fix/':      'bug',
              'feature/':  'enhancement',
              'docs/':     'documentation',
              'refactor/': 'refactor',
              'test/':     'testing',
              'ci/':       'ci/cd',
            };

            for (const [prefix, label] of Object.entries(labelMap)) {
              if (branch.startsWith(prefix)) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.pull_request.number,
                    labels: [label],
                  });
                } catch (e) {
                  console.log(`Could not add label "${label}": ${e.message}`);
                }
                break;
              }
            }
