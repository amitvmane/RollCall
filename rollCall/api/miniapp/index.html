<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RollCall</title>
  <!-- No async/defer: app.js (loaded synchronously at the end of <body>)
       reads window.Telegram.WebApp at its top level and must run after this
       has executed, not racing it. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="loading" class="center-fill">
      <div class="spinner"></div>
      <p>Loading…</p>
    </div>
    <div id="error-screen" class="center-fill hidden">
      <div class="error-icon">⚠️</div>
      <p id="error-msg">Something went wrong.</p>
      <button id="retry-btn" class="btn btn-primary">Retry</button>
    </div>
    <div id="main" class="hidden">
      <header class="app-header">
        <div class="app-header-row">
          <button id="back-btn" class="back-btn hidden" onclick="backToGroups()" title="Back to groups" aria-label="Back to groups">←</button>
          <h1 id="chat-title">RollCall</h1>
          <button id="settings-btn" class="settings-btn hidden" onclick="toggleSettings()" title="Settings" aria-label="Settings">⚙️</button>
        </div>
        <div id="rc-tabs" class="tab-bar"></div>
      </header>
      <div id="settings-panel" class="settings-panel hidden">
        <div class="section-label">🕐 Timezone</div>
        <p class="hint">Used for scheduled templates and auto-close timing.</p>
        <div class="settings-row">
          <span id="tz-current" class="tz-current"></span>
          <button class="btn btn-primary" onclick="detectTimezone()">📍 Detect</button>
        </div>
      </div>

      <!-- Shown when the app was opened without real chat context (see
           app.js boot()/state.chatIsGroup) — Telegram's private-chat menu
           button never carries a group with it, so this is the normal
           entry path, not a fallback for an edge case. -->
      <div id="group-picker"></div>
      <div id="groups-empty" class="center-fill hidden">
        <div class="empty-icon">👥</div>
        <p>No groups yet.</p>
        <p class="hint">Vote at least once in a group — from a rollcall panel or its web link — and it'll show up here.</p>
      </div>

      <div id="rollcall-list"></div>
      <div id="empty-state" class="center-fill hidden">
        <div class="empty-icon">📋</div>
        <p>No active rollcalls.</p>
        <p class="hint">An admin can start one with <code>/src</code> in the group.</p>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
