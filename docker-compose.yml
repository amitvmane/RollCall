services:
  # ---------------------------------------------------------------------------
  # Optional PostgreSQL, for running or developing against the Postgres code
  # path instead of SQLite. Profile-gated, so it NEVER starts on a normal
  # `docker compose up` — an existing SQLite deployment is unaffected by its
  # presence here.
  #
  #   make up-postgres      start Postgres, wait for it, then start the bot
  #
  # Point the bot at it by setting this in .env (the hostname is the service
  # name, resolved on the compose network):
  #   DATABASE_URL=postgresql://rollcall:rollcall@postgres:5432/rollcall
  #
  # Deliberately NOT wired up with depends_on: a depends_on pointing at a
  # profile-gated service makes plain `docker compose up` fail when that
  # profile is inactive. `make up-postgres` sequences the two instead.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rollcall-postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-rollcall}
      - POSTGRES_USER=${POSTGRES_USER:-rollcall}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rollcall}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback only, so a local psql/GUI client works but the database
    # is never reachable from outside the machine. Change the port (not the IP)
    # with POSTGRES_HOST_PORT if 5432 is already taken on your host.
    ports:
      - "${POSTGRES_HOST_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rollcall} -d ${POSTGRES_DB:-rollcall}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  rollcall-bot:
    build:
      context: .
      dockerfile: dockerfile
    # Named so the db-backup sidecar can reuse the same image (it already has
    # sqlite3 and scripts/backup_db.sh baked in — no separate image to pull).
    image: rollcall-bot:local
    container_name: rollcall-bot
    restart: unless-stopped

    # Privilege hardening: the bot is a plain Python process — it needs no
    # Linux capabilities and must never gain new privileges (setuid etc.).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    environment:
      # Telegram Bot Configuration
      # All values fall back to the defaults below when the key is absent or
      # commented in .env — so .env is the single source of truth: uncomment a
      # line there to override, leave it commented to keep the default.
      - API_KEY=${API_KEY}
      - ADMIN1=${ADMIN1:-}
      - ADMIN2=${ADMIN2:-}
      - TELEGRAM_TOKEN=${API_KEY}
      - HEALTH_CHECK_PORT=${HEALTH_CHECK_PORT:-8080}

      # Database Configuration (SQLite with persistent volume)
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/rollcall.db}
      - TZ=${TZ:-Asia/Kolkata}

      # REST API / Web App / Mini App
      # Set REST_API_ENABLED=true to turn on FastAPI (required for web + miniapp)
      - REST_API_ENABLED=${REST_API_ENABLED:-false}
      - REST_API_PORT=${REST_API_PORT:-8081}
      - REST_API_HOST=${REST_API_HOST:-0.0.0.0}

      # Web App — set to your public HTTPS URL (e.g. via Cloudflare Tunnel below)
      # Leave unset to disable web voting links in panels and /weblink
      - WEB_BASE_URL=${WEB_BASE_URL:-}

      # Mini App — set to <WEB_BASE_URL>/web/ to wire the Telegram menu button
      # at the full web app. Leave unset to disable the menu button.
      - MINIAPP_URL=${MINIAPP_URL:-}

      # Telegram Login Widget on the sign-in dialog. Only turn on after
      # /setdomain in BotFather — see .env.example.
      - TG_LOGIN_WIDGET=${TG_LOGIN_WIDGET:-}

    volumes:
      # Persist database across container restarts.
      #
      # DATA_DIR deliberately defaults OUTSIDE the git working tree. It used to
      # be ./data, and on 2026-08-24 a deploy checked out the repo and replaced
      # the live production database with the near-empty copy that had been
      # committed to git months earlier. Untracking that file removed the
      # trigger; keeping the database out of the tree entirely removes the
      # whole class of hazard — no checkout, `git clean -fdx`, or stash can
      # reach it. Override with DATA_DIR=/var/lib/rollcall in .env.
      #
      # Docker silently creates a missing bind-mount source as an empty
      # root-owned directory, which would look exactly like total data loss,
      # so `make up` refuses to start unless DATA_DIR already exists.
      - ${DATA_DIR:-../rollcall-data}:/app/data

      # Persist logs
      - ./logs:/app/logs

    ports:
      # Health-check endpoint. HEALTH_CHECK_HOST_PORT is the HOST port (change it
      # to avoid clashes with other services on 8080); HEALTH_CHECK_PORT is the
      # in-container port the app binds. Both default to 8080.
      - "${HEALTH_CHECK_HOST_PORT:-8080}:${HEALTH_CHECK_PORT:-8080}"
      # Port 8081 (REST API) is intentionally NOT exposed to the host.
      # cloudflared reaches it over the internal Docker network instead.

    # Read environment variables from .env file
    env_file:
      - .env

    # HTTP-based health check using curl (port follows HEALTH_CHECK_PORT)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HEALTH_CHECK_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Daily SQLite backup sidecar.
  #
  # Reuses the bot image (sqlite3 + scripts/backup_db.sh already inside). Takes
  # a consistent online-backup snapshot once on start, then every 24h, gzips it
  # into ./data/backups/ on the host and prunes anything older than the
  # retention window. No-ops on Postgres / MEMORY_MODE (no DB file to copy).
  #
  # Restore: stop the bot, then run scripts/restore_db.sh <snapshot.db.gz> on
  # the host. Don't gunzip a snapshot over ./data/rollcall.db by hand — the
  # restored file inherits your host user's UID/umask, which the container
  # (root, but cap_drop: ALL — no CAP_DAC_OVERRIDE — below) may not be able
  # to write to; restore_db.sh sets the same permissive mode the data
  # directory already gets at build time so this can't happen.
  # ---------------------------------------------------------------------------
  db-backup:
    image: rollcall-bot:local
    container_name: rollcall-db-backup
    restart: unless-stopped
    depends_on:
      - rollcall-bot
    environment:
      - BACKUP_DB_PATH=/app/data/rollcall.db
      - BACKUP_DIR=/app/data/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ${DATA_DIR:-../rollcall-data}:/app/data
    entrypoint: ["/bin/sh", "-c"]
    # Run once immediately, then daily. Override the cadence with BACKUP_INTERVAL_SECONDS.
    command:
      - 'while true; do /app/scripts/backup_db.sh || true; sleep "${BACKUP_INTERVAL_SECONDS:-86400}"; done'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---------------------------------------------------------------------------
  # Off-site backup sidecar — ships local SQLite snapshots to any rclone remote
  # (Google Drive, S3, Backblaze B2, etc.).
  #
  # Uses `rclone copy` (not sync) so the remote retains history forever even
  # when the local 7-day retention window prunes old snapshots. Critical for
  # financial ledger data — never delete remote copies.
  #
  # One-time setup on the host:
  #   1. Install rclone: https://rclone.org/install/
  #   2. Configure a remote: rclone config
  #   3. Set RCLONE_REMOTE=<name>:<bucket/path> in .env
  #      e.g. RCLONE_REMOTE=gdrive:rollcall-backups
  #   4. (Optional) Set RCLONE_CONFIG_PATH if your rclone.conf is not at
  #      the default path (~/.config/rclone).
  #   5. Start: docker-compose --profile backup-remote up -d
  #
  # The sidecar runs a copy every BACKUP_SYNC_INTERVAL_SECONDS (default 1 hour).
  # ---------------------------------------------------------------------------
  backup-sync:
    image: rclone/rclone:latest
    container_name: rollcall-backup-sync
    restart: unless-stopped
    profiles:
      - backup-remote  # only starts with: docker-compose --profile backup-remote up -d
    depends_on:
      - db-backup
    environment:
      - RCLONE_REMOTE=${RCLONE_REMOTE:-myremote:rollcall-backups}
      - BACKUP_SYNC_INTERVAL_SECONDS=${BACKUP_SYNC_INTERVAL_SECONDS:-3600}
    volumes:
      # Local backups written by db-backup sidecar (read-only here)
      - ${DATA_DIR:-../rollcall-data}/backups:/backups:ro
      # Host rclone config (must already be configured via `rclone config`)
      - ${RCLONE_CONFIG_PATH:-~/.config/rclone}:/config/rclone:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) rclone copy /backups $${RCLONE_REMOTE}"
          rclone copy /backups "$${RCLONE_REMOTE}" \
            --config /config/rclone/rclone.conf \
            --log-level INFO || true
          sleep "$${BACKUP_SYNC_INTERVAL_SECONDS:-3600}"
        done
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Cloudflare Tunnel is no longer run from here — the blobsystems infra repo
  # now owns the tunnel (container blobsystems-cloudflared) and Nginx proxies
  # rbot.blobsystems.xyz to this container's REST API (port 8081) over a
  # shared Docker network. See ../blobsystems/docker-compose.yml.

volumes:
  # Only created when the `postgres` profile is used. SQLite deployments keep
  # their data in the DATA_DIR bind mount instead and never touch this.
  pgdata:
