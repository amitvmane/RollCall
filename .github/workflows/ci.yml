name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

jobs:
  test:
    name: Run Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (locked)
        run: pip install -r requirements.lock pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run integration tests
        run: python -m pytest integration_tests/ -v --tb=short

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-flake8

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        # Config (max-line-length, exclude, extend-ignore) lives in .flake8
        # at repo root — shared with local dev, not duplicated in this yaml.
        run: flake8 rollCall/ --count --statistics || true
        # '|| true' so lint warnings don't block merge — review output manually

  smoke:
    name: Smoke (real-import boot check)
    runs-on: ubuntu-latest
    # Runs the production import chain against the REAL pinned dependencies
    # (no test mocks). Catches signature mismatches like the v7.8
    # use_class_middlewares=True TypeError that unit tests can't surface
    # because they mock telebot away.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-smoke-${{ hashFiles('requirements.lock') }}

      - name: Install runtime dependencies (locked)
        run: pip install -r requirements.lock

      - name: Run smoke test
        env:
          TELEGRAM_TOKEN: "123:ci-smoke"
        run: python scripts/smoke_test.py

  functional:
    name: Functional (real telebot, 121 scenarios)
    runs-on: ubuntu-latest
    # Drives realistic Telegram Update payloads through the REAL telebot
    # router, middleware chain and handlers against a temp SQLite DB — only
    # outbound network calls are patched. This is the layer the other jobs
    # structurally cannot cover: integration_tests/ mocks telebot entirely and
    # the smoke test only checks imports + method existence.
    #
    # Written to qualify the 4.14.1 -> 4.34.0 telebot bump (PR #15) and left
    # unwired afterwards, so it took a manual run to get any signal on the
    # 2026-08-18 dependency bump. Now it runs on every check-in.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-functional-${{ hashFiles('requirements.lock') }}

      - name: Install runtime dependencies (locked)
        run: pip install -r requirements.lock

      - name: Run functional test
        run: python scripts/functional_test.py

  load-test:
    name: Load test (10 groups x 50 users)
    runs-on: ubuntu-latest
    # Real telebot processing (no handler mocks) driving 10 groups x 50
    # simulated voters (500 total) CONCURRENTLY through the full feature
    # surface -- voting (sequential + concurrent burst), stats, dues
    # settlement, templates/scheduler, identity merge -- plus cross-group
    # isolation and bot-wide /stats at 10-group scale.
    # ~3-4s locally; cheap enough to run on every push/PR alongside smoke.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-loadtest-${{ hashFiles('requirements.lock') }}

      - name: Install runtime dependencies (locked)
        run: pip install -r requirements.lock

      - name: Run load test
        run: python scripts/load_test_50_users.py

      - name: Run realistic parallel scenario
        run: python scripts/parallel_scenario_test.py

  postgres:
    name: Postgres (integration + load + scenario)
    runs-on: ubuntu-latest
    # Everything above runs on SQLite. Postgres is the other supported
    # backend and behaves differently in ways SQLite silently tolerates:
    # BOOLEAN columns reject 0/1 ints, jsonb comes back already decoded,
    # TIMESTAMP columns return datetime objects rather than strings, and
    # foreign keys are actually enforced. Three production bugs of exactly
    # that shape (dues could never be enabled, ghost-selection recovery
    # always returned nothing, the identities endpoint 500'd) shipped
    # undetected because no CI job ever pointed the suite at a real
    # Postgres. This job is what keeps them from coming back.

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rolltest
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rollcall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://rolltest:test@127.0.0.1:5432/rollcall_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-postgres-${{ hashFiles('requirements.lock') }}

      - name: Install dependencies (locked)
        run: pip install -r requirements.lock pytest

      - name: Run integration tests against Postgres
        run: python -m pytest integration_tests/ -v --tb=short

      - name: Run load test against Postgres
        run: python scripts/load_test_50_users.py

      - name: Run realistic parallel scenario against Postgres
        run: python scripts/parallel_scenario_test.py

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # Scans the pinned closure in requirements.lock against the OSV / PyPI
    # advisory databases. Gated through scripts/check_audit_baseline.py rather
    # than failing on any finding: six pins were already vulnerable when this
    # was switched on (2026-08-17), and a job that is red from day one gets
    # ignored. The baseline makes NEW vulnerable dependencies fail while the
    # known six are tracked in security/audit_baseline.json until bumped.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-audit

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # --no-deps: requirements.lock is a fully-pinned pip-compile closure, so
        # audit exactly what ships rather than re-resolving it.
        # '|| true': pip-audit exits non-zero on any finding; the baseline check
        # below is what decides pass/fail.
        run: |
          pip-audit -r requirements.lock --no-deps \
            --format json --output audit.json --progress-spinner off || true

      - name: Check against baseline
        run: python scripts/check_audit_baseline.py audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: audit.json

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t rollcall-bot:ci .
